<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Traditional Japanese Vermilion / Crimson (Shu-iro to Shinku) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="45%" stop-color="#D90429"/>
      <stop offset="100%" stop-color="#6B0014"/>
    </linearGradient>

    <!-- Inner Ambient Glow -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Subtle Diagonal Manga Panel Sheen -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Deep Drop Shadow for Elevation -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#3D000C" flood-opacity="0.45"/>
    </filter>

    <!-- Glyph Drop Shadow -->
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4A000A" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad)" filter="url(#softShadow)"/>
  
  <!-- Diagonal Manga Sheen Accent -->
  <path d="M 32 140 Q 32 32 140 32 L 350 32 L 32 350 Z" fill="url(#sheenGrad)" />

  <!-- Inner Bevel Highlight -->
  <rect x="34" y="34" width="444" height="444" rx="106" ry="106" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.25"/>
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#innerGlow)"/>

  <!-- Manga Dialogue / Speech Bubble Dots Accent in Corner -->
  <circle cx="414" cy="98" r="14" fill="#FFFFFF" fill-opacity="0.35" />
  <circle cx="438" cy="122" r="7" fill="#FFFFFF" fill-opacity="0.25" />

  <!-- Central Japanese Hiragana 'あ' (A) Glyph -->
  <text x="256" y="324" 
        font-family="Noto Serif CJK JP, Noto Sans CJK JP, 'Source Han Serif', serif" 
        font-size="264" 
        font-weight="900" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        dominant-baseline="central"
        filter="url(#glyphShadow)">あ</text>

  <!-- Minimalist 'MOKURO' Brand Subtext -->
  <text x="256" y="428" 
        font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="9" 
        fill="#FFFFFF" 
        fill-opacity="0.88" 
        text-anchor="middle">MOKURO</text>
</svg>
